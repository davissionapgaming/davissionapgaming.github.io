<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="Foundations Bootcamp: a practical roadmap for Linux, networking, and scripting. Track topics, resources, homework, and flashcards.">
  <meta property="og:title" content="Foundations Bootcamp">
  <meta property="og:description" content="Linux, networking, and scripting fundamentals in one focused study dashboard.">
  <meta property="og:type" content="website">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <title>Foundations Bootcamp</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#08101d;
      --bg-soft:#0e1726;
      --card:rgba(17,27,43,.86);
      --card-strong:#111b2b;
      --text:#eef4ff;
      --muted:#9caabd;
      --accent:#66a7ff;
      --accent-strong:#2f7ff7;
      --accent2:#44d483;
      --warning:#f7c85b;
      --border:rgba(255,255,255,.09);
      --shadow:0 18px 55px rgba(0,0,0,.28);
      --radius:18px;
      --max:1040px;
    }
    :root[data-theme="light"]{
      color-scheme:light;
      --bg:#f4f7fb;
      --bg-soft:#eaf0f8;
      --card:rgba(255,255,255,.9);
      --card-strong:#fff;
      --text:#142033;
      --muted:#5e6b7e;
      --accent:#156ee8;
      --accent-strong:#0c5bc4;
      --accent2:#1d9f5b;
      --warning:#9b6d00;
      --border:rgba(20,32,51,.10);
      --shadow:0 18px 55px rgba(30,55,90,.11);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:120px}
    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at 15% 0%, rgba(76,135,255,.15), transparent 32rem),
        radial-gradient(circle at 90% 10%, rgba(68,212,131,.09), transparent 28rem),
        var(--bg);
      color:var(--text);
      font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      line-height:1.5;
    }
    button,a,input{font:inherit}
    a{color:inherit}
    .skip{position:fixed;left:12px;top:-60px;z-index:100;padding:10px 14px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none}
    .skip:focus{top:12px}
    .shell{max-width:var(--max);margin:0 auto;padding:0 18px}
    header{
      position:sticky;top:0;z-index:50;
      backdrop-filter:blur(18px);
      background:color-mix(in srgb,var(--bg) 78%,transparent);
      border-bottom:1px solid var(--border);
      padding-top:env(safe-area-inset-top,0px);
    }
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .brand-mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 9px 25px rgba(61,132,255,.22);display:grid;place-items:center;color:#fff;font-weight:800}
    .brand-copy{min-width:0}
    .brand-title{font-weight:800;letter-spacing:-.02em;white-space:nowrap}
    .brand-sub{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .actions{display:flex;gap:8px}
    .icon-btn,.text-btn,.tab{
      border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;transition:.18s ease;
    }
    .icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
    .text-btn{padding:9px 12px;border-radius:11px}
    .icon-btn:hover,.text-btn:hover,.tab:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 55%,var(--border))}
    .tabs-wrap{overflow:auto;scrollbar-width:none}
    .tabs-wrap::-webkit-scrollbar{display:none}
    .tabs{display:flex;gap:8px;padding:0 0 12px}
    .tab{flex:none;border-radius:999px;padding:9px 14px;font-size:.87rem;color:var(--muted)}
    .tab.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(40,107,220,.22)}
    main{padding:26px 0 72px}
    .hero{display:grid;grid-template-columns:1.4fr .8fr;gap:18px;align-items:stretch;margin-bottom:18px}
    .hero-card,.stat-card,.content-card,.flash-card,.notice{
      background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:var(--radius);
    }
    .hero-card{padding:28px}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--accent);font-size:.76rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
    h1{font-size:clamp(2rem,4vw,3.2rem);line-height:1.04;letter-spacing:-.045em;margin:10px 0 12px;max-width:12ch}
    .hero-copy{max-width:62ch;color:var(--muted);font-size:1rem}
    .hero-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
    .primary{border:0;background:var(--accent);color:#fff;padding:11px 15px;border-radius:11px;cursor:pointer;font-weight:750;box-shadow:0 10px 25px rgba(48,126,244,.2)}
    .secondary{border:1px solid var(--border);background:transparent;color:var(--text);padding:11px 15px;border-radius:11px;cursor:pointer}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .stat-card{padding:18px}
    .stat-label{font-size:.78rem;color:var(--muted);margin-bottom:5px}
    .stat-value{font-size:1.7rem;font-weight:820;letter-spacing:-.04em}
    .progress{height:9px;margin-top:12px;background:color-mix(in srgb,var(--muted) 15%,transparent);border-radius:999px;overflow:hidden}
    .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:inherit;transition:width .3s ease}
    .content-card{padding:22px;margin-top:18px}
    .section-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:15px}
    .section-head h2{font-size:1.25rem;margin:0 0 4px;letter-spacing:-.025em}
    .intro{margin:0;color:var(--muted);font-size:.92rem}
    .percent{white-space:nowrap;font-size:.82rem;color:var(--accent2);font-weight:750}
    .topic{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px dashed var(--border);font-size:.93rem}
    .topic:last-child{border-bottom:0}
    .topic input{accent-color:var(--accent);width:18px;height:18px;flex:none;margin-top:1px}
    .subhead{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:800;margin:22px 0 10px}
    .resource-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .resource{display:block;text-decoration:none;border:1px solid var(--border);border-radius:13px;padding:13px;background:var(--bg-soft);transition:.18s ease}
    .resource:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 55%,var(--border))}
    .resource strong{display:block;font-size:.9rem;margin-bottom:3px}
    .resource span{display:block;color:var(--muted);font-size:.77rem;line-height:1.45}
    .hw{padding:10px 0;border-bottom:1px dashed var(--border);font-size:.9rem}
    .hw:last-child{border-bottom:0}
    .flash-card{padding:22px;margin-top:18px}
    .flash-inner{min-height:230px;border:1px solid var(--border);border-radius:16px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;text-align:center;padding:36px 26px;cursor:pointer;position:relative;user-select:none}
    .flash-inner .tag{position:absolute;top:13px;left:15px;font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
    .flash-inner .hint{position:absolute;bottom:13px;font-size:.72rem;color:var(--muted)}
    .flash-question{font-size:1.18rem;font-weight:740;max-width:700px}
    .flash-answer{font-size:1.05rem;max-width:700px;color:var(--text)}
    .flash-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:13px}
    .flash-nav .center{color:var(--muted);font-size:.82rem}
    .notice{padding:15px 17px;margin-top:18px;color:var(--muted);font-size:.84rem}
    footer{color:var(--muted);text-align:center;font-size:.77rem;padding:0 18px 32px}
    dialog{border:1px solid var(--border);border-radius:18px;background:var(--card-strong);color:var(--text);padding:22px;max-width:420px;width:calc(100% - 32px);box-shadow:var(--shadow)}
    dialog::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
    .dialog-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
    @media (max-width:780px){
      .hero{grid-template-columns:1fr}
      .stats{grid-template-columns:repeat(4,1fr)}
      .stat-card{padding:14px}
      .stat-value{font-size:1.35rem}
    }
    @media (max-width:620px){
      .shell{padding:0 13px}
      .topbar{min-height:62px}
      .brand-mark{width:33px;height:33px;border-radius:10px}
      .brand-sub{display:none}
      .hero-card{padding:22px}
      h1{max-width:none;font-size:2.2rem}
      .stats{grid-template-columns:repeat(2,1fr)}
      .resource-grid{grid-template-columns:1fr}
      .content-card,.flash-card{padding:17px}
      .section-head{align-items:flex-start}
      .section-head h2{font-size:1.15rem}
      .flash-inner{min-height:245px;padding:34px 20px}
      .flash-nav{flex-wrap:wrap}
      .flash-nav .center{order:-1;width:100%;text-align:center}
    }
    @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}
  </style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header>
  <div class="shell topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">⚡</div>
      <div class="brand-copy">
        <div class="brand-title">Foundations Bootcamp</div>
        <div class="brand-sub">Linux · Networking · Scripting</div>
      </div>
    </div>
    <div class="actions">
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme" title="Toggle theme">☼</button>
      <button class="icon-btn" id="resetBtn" type="button" aria-label="Reset progress" title="Reset progress">↺</button>
    </div>
  </div>
  <div class="shell tabs-wrap">
    <nav class="tabs" id="tabs" aria-label="Bootcamp sections"></nav>
  </div>
</header>

<main id="main" class="shell" tabindex="-1"></main>

<footer>Built as a zero-build static site. Your progress is saved locally in this browser.</footer>

<dialog id="resetDialog">
  <form method="dialog">
    <h3 style="margin-top:0">Reset your progress?</h3>
    <p style="color:var(--muted);font-size:.9rem">This clears the checklist progress stored in this browser. Your course content stays untouched.</p>
    <div class="dialog-actions">
      <button class="secondary" value="cancel">Cancel</button>
      <button class="primary" id="confirmReset" value="reset">Reset</button>
    </div>
  </form>
</dialog>

<script>
const DATA = {
  linux: {
    emoji:"Linux",
    intro:"The OS every server on Earth runs on. If you can't move confidently in a terminal, nothing else in DevOps sticks.",
    topics:["Filesystem hierarchy: /etc, /var, /home, /usr, /tmp","Navigating: ls, cd, pwd, find, locate","File ops: cp, mv, rm, mkdir, touch, cat, less","Permissions and ownership: chmod, chown, umask","Users and groups: useradd, passwd, sudo","Processes: ps aux, top, htop, kill, nice","Package managers: apt, yum, dnf","systemd and services: systemctl, journalctl","Piping and redirection: pipes, output redirection, xargs","Text processing: grep, sed, awk, cut, sort"],
    resources:[["Linux Journey","https://linuxjourney.com","Free, structured, gamified path, start here"],["OverTheWire: Bandit","https://overthewire.org/wargames/bandit/","Wargame where each level teaches a real command, this is what makes it click"],["The Linux Command Line (free book)","https://linuxcommand.org/tlcl.php","Best free deep-dive reference for the why, not just the what"],["explainshell.com","https://explainshell.com","Paste any command, get every flag explained"]],
    homework:["Beat OverTheWire Bandit levels 0 to 10 (seriously, do this first)","Write a one-liner that finds every file over 100MB in your home dir","Create a new user, grant sudo, then confirm it works","Use journalctl to find the last 20 errors on your machine"]
  },
  net: {
    emoji:"Net",
    intro:"DevOps is mostly machines talking to each other. If you don't get how, every connection-refused error will feel like magic.",
    topics:["OSI model and TCP/IP basics","IP addressing and subnetting","DNS resolution: how a name becomes an IP","HTTP and HTTPS request lifecycle","Common ports: 22, 80, 443, 3306, 5432","Firewalls and security groups","Load balancers: L4 vs L7","SSH and key-based auth","curl, ping, traceroute, netstat and ss","NAT and basic VPN concepts"],
    resources:[["Cloudflare Learning Center","https://www.cloudflare.com/learning/","Clearest plain-English networking explainers around"],["Professor Messer, Network+","https://www.professormesser.com","Free full video course, great for fundamentals"],["subnettingpractice.com","https://subnettingpractice.com","Drill subnetting until it's second nature"],["Wireshark","https://www.wireshark.org","Install it and actually watch packets fly, it only clicks once you see it live"]],
    homework:["Subnet a /24 into 4 equal subnets by hand, no calculator","Run curl -v against any API and explain every header you see","traceroute a website and explain what each hop is doing","Write out, step by step, everything that happens when you hit Enter on a URL"]
  },
  script: {
    emoji:"Script",
    intro:"Automation is the whole point of DevOps. If you can't script it, you're doing manual work with extra steps.",
    topics:["Bash variables and quoting","Conditionals and loops in bash","Functions and script arguments ($1, $@)","Exit codes and error handling (set -euo pipefail)","Scheduling with cron","Python basics: variables, lists, dicts","Python file I/O and modules","Writing a script that automates a real task","pip and virtual environments (venv)","Reading and writing YAML and JSON, used everywhere in DevOps configs"],
    resources:[["Ryan's Bash Scripting Tutorial","https://ryanstutorials.net/bash-scripting-tutorial/","Best free start-to-finish bash tutorial"],["Python for Everybody (free)","https://www.py4e.com","Full free course and book, zero to competent Python"],["Automate the Boring Stuff","https://automatetheboringstuff.com","Free online, project-based, exactly the mindset DevOps needs"],["ShellCheck","https://www.shellcheck.net","Paste your bash script, it roasts your mistakes, use it constantly"]],
    homework:["Write a bash script that backs up a folder into a timestamped .tar.gz","Write a Python script that reads a CSV and prints a summary","Set a cron job to run your backup script every night at 2am","Take an old script and rewrite it with proper error handling"]
  }
};

const FLASH = [
  ["linux","What does chmod 755 do to a file?","Owner gets read, write, execute. Group and others get read and execute."],
  ["linux","What's the difference between > and >> in bash?","> overwrites the file's contents. >> appends to the end without erasing what's there."],
  ["linux","Command to see currently running processes?","ps aux, or top / htop for a live view"],
  ["linux","Where do most system logs live?","/var/log, or use journalctl on systemd machines"],
  ["linux","What does chown do?","Changes the owner (and optionally group) of a file or directory"],
  ["net","What port does HTTPS use?","443 (HTTP uses port 80)"],
  ["net","What does DNS actually do?","Translates human-readable domain names into IP addresses"],
  ["net","TCP vs UDP, key difference?","TCP is connection-oriented and reliable. UDP is faster but doesn't guarantee delivery."],
  ["net","What does a subnet mask define?","Which part of an IP address is the network portion vs the host portion"],
  ["net","Forward proxy vs reverse proxy?","A forward proxy hides the client from the server. A reverse proxy hides the server from the client."],
  ["script","What does set -e do in a bash script?","Makes the script exit immediately if any command fails"],
  ["script","What is $1 in a bash script?","The first argument passed to the script when it runs"],
  ["script","Python module for working with JSON?","The built-in json module, json.loads() and json.dumps()"],
  ["script","Why use a virtual environment (venv)?","Isolates a project's Python dependencies from your system and other projects"],
  ["script","What does the cron schedule 0 2 * * * mean?","Run at 2:00 AM every day"]
];

const TABS = [["linux","Linux"],["net","Networking"],["script","Scripting"],["flash","Flashcards"]];
const STORAGE = "foundationsBootcampV2";
let state = {};
try { state = JSON.parse(localStorage.getItem(STORAGE) || "{}"); } catch (_) { state = {}; }
let activeTab = location.hash ? location.hash.slice(1) : "linux";
if (!TABS.some(t => t[0] === activeTab)) activeTab = "linux";
let fcIndex = 0;
let fcFlipped = false;
let fcPool = FLASH.map((_, i) => i);

function save(){ try { localStorage.setItem(STORAGE, JSON.stringify(state)); } catch (_) {} }
function escapeHtml(value){ return String(value).replace(/[&<>'"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[ch])); }
function pct(key){ const total = DATA[key].topics.length; const done = DATA[key].topics.filter((_, i) => state[key + "_" + i]).length; return Math.round(done / total * 100); }
function totalStats(){
  const total = Object.values(DATA).reduce((sum, d) => sum + d.topics.length, 0);
  const done = Object.keys(DATA).reduce((sum, key) => sum + DATA[key].topics.filter((_, i) => state[key + "_" + i]).length, 0);
  return { total, done, percent: total ? Math.round(done / total * 100) : 0 };
}
function renderTabs(){
  document.getElementById("tabs").innerHTML = TABS.map(([key, label]) => `<button class="tab ${key === activeTab ? "active" : ""}" data-tab="${key}" type="button">${label}</button>`).join("");
  document.querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => show(btn.dataset.tab)));
}
function renderStats(){
  const s = totalStats();
  return `<div class="stats" aria-label="Progress summary">
    <div class="stat-card"><div class="stat-label">Overall</div><div class="stat-value">${s.percent}%</div><div class="progress"><i style="width:${s.percent}%"></i></div></div>
    <div class="stat-card"><div class="stat-label">Topics done</div><div class="stat-value">${s.done}</div></div>
    <div class="stat-card"><div class="stat-label">Topics total</div><div class="stat-value">${s.total}</div></div>
    <div class="stat-card"><div class="stat-label">Flashcards</div><div class="stat-value">${FLASH.length}</div></div>
  </div>`;
}
function renderHomeHero(){
  return `<section class="hero">
    <div class="hero-card">
      <div class="eyebrow">⚡ DevOps foundations</div>
      <h1>Build the fundamentals. Then ship.</h1>
      <p class="hero-copy">A focused study dashboard for Linux, networking, and scripting. Check topics off as they become comfortable, jump into the linked resources, and test recall with mixed flashcards.</p>
      <div class="hero-actions">
        <button class="primary" id="continueBtn" type="button">Continue learning</button>
        <button class="secondary" id="randomBtn" type="button">Random flashcard</button>
      </div>
    </div>
    ${renderStats()}
  </section>`;
}
function renderDomain(key){
  const d = DATA[key];
  const name = key === "net" ? "Networking" : key.charAt(0).toUpperCase() + key.slice(1);
  const percent = pct(key);
  const topics = d.topics.map((topic, i) => `<label class="topic"><input type="checkbox" data-key="${key}_${i}" ${state[key + "_" + i] ? "checked" : ""}><span>${escapeHtml(topic)}</span></label>`).join("");
  const resources = d.resources.map(([title, url, desc]) => `<a class="resource" href="${url}" target="_blank" rel="noopener noreferrer"><strong>${escapeHtml(title)}</strong><span>${escapeHtml(desc)}</span></a>`).join("");
  const homework = d.homework.map(h => `<div class="hw">• ${escapeHtml(h)}</div>`).join("");
  return `${renderHomeHero()}<section class="content-card">
    <div class="section-head"><div><h2>${name}</h2><p class="intro">${escapeHtml(d.intro)}</p></div><div class="percent">${percent}% complete</div></div>
    <div class="progress"><i style="width:${percent}%"></i></div>
    <div class="subhead">Core topics</div>
    <div>${topics}</div>
    <div class="subhead">Go deeper</div>
    <div class="resource-grid">${resources}</div>
    <div class="subhead">Homework, actually do these</div>
    <div>${homework}</div>
  </section>
  <div class="notice">Your checklist is stored in <strong>localStorage</strong>, so it survives refreshes on this device without a backend. It is not synced across devices.</div>`;
}
function renderFlash(){
  const item = FLASH[fcPool[fcIndex]];
  return `${renderHomeHero()}<section class="flash-card">
    <div class="section-head"><div><h2>Flashcards</h2><p class="intro">Tap a card to flip it. The deck mixes all three domains on purpose.</p></div><div class="percent">${fcIndex + 1} / ${fcPool.length}</div></div>
    <div class="flash-inner" id="flashCard" role="button" tabindex="0" aria-label="Flashcard. Activate to flip.">
      <span class="tag">${escapeHtml(item[0])}</span>
      <div class="${fcFlipped ? "flash-answer" : "flash-question"}">${escapeHtml(fcFlipped ? item[2] : item[1])}</div>
      <span class="hint">${fcFlipped ? "tap to see the question" : "tap to reveal the answer"}</span>
    </div>
    <div class="flash-nav">
      <button class="secondary" id="fcPrev" type="button">← Prev</button>
      <span class="center">Mixed recall mode</span>
      <button class="secondary" id="fcShuffle" type="button">⤨ Shuffle</button>
      <button class="primary" id="fcNext" type="button">Next →</button>
    </div>
  </section>`;
}
function render(){
  renderTabs();
  const main = document.getElementById("main");
  main.innerHTML = activeTab === "flash" ? renderFlash() : renderDomain(activeTab);
  bindCommon();
  if(activeTab === "flash") bindFlash(); else bindDomain(activeTab);
}
function bindCommon(){
  const continueBtn = document.getElementById("continueBtn");
  if(continueBtn) continueBtn.addEventListener("click", () => { show(firstIncomplete() || "linux"); });
  const randomBtn = document.getElementById("randomBtn");
  if(randomBtn) randomBtn.addEventListener("click", () => { activeTab="flash"; fcIndex=Math.floor(Math.random()*fcPool.length); fcFlipped=false; syncHash(); render(); window.scrollTo({top:0,behavior:"smooth"}); });
}
function bindDomain(key){
  document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.addEventListener("change", () => { state[cb.dataset.key] = cb.checked; save(); render(); }));
}
function bindFlash(){
  const card = document.getElementById("flashCard");
  const flip = () => { fcFlipped = !fcFlipped; render(); };
  card.addEventListener("click", flip);
  card.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); flip(); } });
  document.getElementById("fcPrev").addEventListener("click", () => { fcIndex = (fcIndex - 1 + fcPool.length) % fcPool.length; fcFlipped = false; render(); });
  document.getElementById("fcNext").addEventListener("click", () => { fcIndex = (fcIndex + 1) % fcPool.length; fcFlipped = false; render(); });
  document.getElementById("fcShuffle").addEventListener("click", () => { shuffle(fcPool); fcIndex = 0; fcFlipped = false; render(); });
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function firstIncomplete(){
  for(const key of ["linux","net","script"]){ if(pct(key) < 100) return key; }
  return "flash";
}
function syncHash(){ history.replaceState(null,"",location.pathname + location.search + (activeTab ? "#" + activeTab : "")); }
function show(tab){ if(!TABS.some(t => t[0] === tab)) return; activeTab=tab; syncHash(); render(); window.scrollTo({top:0,behavior:"smooth"}); }

document.getElementById("themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const next = root.dataset.theme === "dark" ? "light" : "dark";
  root.dataset.theme = next;
  localStorage.setItem("foundationsTheme", next);
});
const savedTheme = localStorage.getItem("foundationsTheme");
if(savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;

document.getElementById("resetBtn").addEventListener("click", () => document.getElementById("resetDialog").showModal());
document.getElementById("confirmReset").addEventListener("click", () => { state = {}; save(); render(); });
window.addEventListener("hashchange", () => { const key=location.hash.slice(1); if(TABS.some(t => t[0]===key)){ activeTab=key; render(); } });

render();
</script>
</body>
</html>
